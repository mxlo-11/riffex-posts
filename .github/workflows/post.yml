name: Post to Instagram

on:
  # GitHub can start scheduled runs late (sometimes hours), so instead of one or two
  # tries this checks every 10 minutes from 21:00 to 04:50 UTC (5 PM to midnight in
  # New York in both EDT and EST). The script only posts today's folder once it's
  # 5 PM or later in New York, writes posted.json, and every later check exits in
  # seconds with "Nothing due", so today's post goes out at most once.
  schedule:
    - cron: "*/10 21-23 * * *"
    - cron: "*/10 0-4 * * *"
  # A push that adds a queue folder posts today's folder right away if it's already
  # 5 PM or later in New York. Older unposted folders are marked skipped, never posted.
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "post, pending or check (check only reads the profile)"
        default: "check"
      date:
        description: "Queue date YYYY-MM-DD (blank = today)"
        default: ""

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # Always start from the latest main, so a queued run sees posted.json markers
      # written by the run before it and never posts the same day twice.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          POST_DATE: ${{ github.event.inputs.date }}
        run: python scripts/post.py "${{ github.event.inputs.mode || 'pending' }}"
      - name: Record posted marker
        run: |
          if [ -n "$(git status --porcelain queue)" ]; then
            git config user.name "riffex-bot"
            git config user.email "riffex-bot@users.noreply.github.com"
            git add queue
            git commit -m "Mark post as published"
            git pull --rebase origin main
            git push
          fi
